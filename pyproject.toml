[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv",
    "main_service/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = [
    "E402",
    "E501",
    "B008",
    "B904",
]

[tool.pytest.ini_options]
pythonpath = [
    "main_service",
    ".",
]
testpaths = ["tests"]