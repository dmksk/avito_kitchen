services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    container_name: avito_kitchen_postgres
    environment:
      POSTGRES_DB: avito_kitchen
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_kitchen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  establishment-service:
    build:
      context: ./establishment_service
    container_name: avito_kitchen_establishment
    environment:
      MAIN_SERVICE_URL: http://main-service:8000
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  main-service:
    build:
      context: ./main_service
    container_name: avito_kitchen_main
    environment:
      DATABASE_URL: postgresql+psycopg://avito:avito_password@postgres:5432/avito_kitchen
      ESTABLISHMENT_SERVICE_URL: http://establishment-service:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      establishment-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: